name: Test
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua behavior tests (mocked Rime)
        run: |
          for f in tests/test_*.lua; do
            lua5.4 "$f"
          done
      - name: Source integrity and release validation
        run: python3 tests/test_static.py
